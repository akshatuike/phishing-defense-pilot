<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session 2 Login — Phishing Awareness Study</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: white; border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 36px 32px; max-width: 420px; width: 100%;
  }
  .badge {
    background: #1e3a5f; color: white; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px; display: inline-block;
    margin-bottom: 12px;
  }
  h1 { font-size: 22px; color: #1e3a5f; margin-bottom: 8px; }
  p  { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  .info-box {
    background: #fef9c3; border-left: 4px solid #eab308;
    padding: 12px 16px; border-radius: 6px;
    font-size: 13px; color: #713f12; margin-bottom: 24px; line-height: 1.6;
  }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid #d1d5db; border-radius: 8px;
    font-size: 14px; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #3b82f6; }
  .btn {
    width: 100%; padding: 13px; background: #1e3a5f; color: white;
    border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: #2d5491; }
  .error { color: #dc2626; font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="card">
  <span class="badge">🔬 Session 2 — Phishing Awareness Study</span>
  <h1>Welcome Back</h1>
  <p>Please log in with the Participant ID and password you created in Session 1.</p>

  <div class="info-box">
    ⚠ This is your <strong>second and final session</strong>.<br>
    You will complete a 10-question assessment (same format as last week).
  </div>

  {% if error %}
  <div class="error">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/pilot/login">
    <label>Participant ID</label>
    <input type="text" name="participant_id" placeholder="e.g. AK1998" required>
    <label>Password</label>
    <input type="password" name="password" placeholder="Your password" required>
    <button type="submit" class="btn">Log In →</button>
  </form>
</div>
</body>
</html>
